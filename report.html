<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report — SDS Foods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  :root{
    --bg:#F1F2F5; --surface:#FFFFFF; --ink:#1A1E27; --muted:#6B7280;
    --sidebar:#14213D; --sidebar-hover:#1D2E52; --sidebar-text:#B9C3DA;
    --accent:#C08A3E; --accent-dark:#A5732E; --teal:#3F7D6B; --danger:#B94A48;
    --border:#E4E6EB; --radius-sm:6px; --radius-md:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh;}
  h1,h2,h3,.brand,.nav-label{font-family:'Space Grotesk',sans-serif;}
  .sidebar{width:230px;background:var(--sidebar);color:var(--sidebar-text);display:flex;flex-direction:column;
    position:fixed;top:0;left:0;bottom:0;z-index:40;transition:transform .25s ease;}
  .brand{display:flex;align-items:center;gap:10px;padding:22px 20px 18px 22px;color:#fff;
    font-size:19px;font-weight:700;letter-spacing:.2px;border-bottom:1px solid rgba(255,255,255,.08);}
  .brand-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));flex-shrink:0;}
  nav.navlist{margin-top:14px;display:flex;flex-direction:column;gap:2px;padding:0 10px;}
  .navlink{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-sm);
    color:var(--sidebar-text);text-decoration:none;font-size:14.5px;font-weight:500;}
  .navlink svg{width:18px;height:18px;flex-shrink:0;opacity:.85;}
  .navlink:hover{background:var(--sidebar-hover);color:#fff;}
  .navlink.active{background:var(--accent);color:#fff;}
  .navlink.active svg{opacity:1;}
  .sidebar-foot{margin-top:auto;padding:16px 22px;font-size:12px;color:#8792AC;border-top:1px solid rgba(255,255,255,.08);}
  .main{margin-left:230px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:20px 32px;
    display:flex;align-items:center;justify-content:space-between;}
  .topbar h1{margin:0;font-size:22px;font-weight:600;}
  .topbar .sub{margin:2px 0 0;color:var(--muted);font-size:13.5px;}
  .menu-btn{display:none;background:none;border:none;cursor:pointer;padding:6px;}
  .menu-btn svg{width:22px;height:22px;color:var(--ink);}
  .content{padding:28px 32px 60px;flex:1;}
  .card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:6px;}
  .home-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:22px 20px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:14px;
    transition:border-color .15s ease, transform .1s ease;text-decoration:none;color:inherit;}
  .home-card:hover{border-color:var(--accent);}
  .home-card:active{transform:scale(.99);}
  .home-card .icon-wrap{width:42px;height:42px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    background:#F4EBDB;color:var(--accent-dark);}
  .home-card .icon-wrap svg{width:22px;height:22px;}
  .home-card h3{margin:0;font-size:16.5px;font-weight:600;}
  .home-card p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5;}
  .empty-state{background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius-md);
    padding:70px 30px;text-align:center;color:var(--muted);margin-top:6px;}
  .empty-state svg{width:44px;height:44px;color:#C9CDD6;margin-bottom:14px;}
  .empty-state p{margin:0;font-size:14px;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:24px;margin-bottom:22px;}
  .panel h2{margin:0 0 4px;font-size:16px;font-weight:600;}
  .panel .panel-sub{margin:0 0 18px;color:var(--muted);font-size:13px;}
  .form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 16px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12.5px;font-weight:600;color:var(--muted);}
  .field input, .field select{padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);
    font-size:14px;font-family:'Inter',sans-serif;color:var(--ink);background:#FAFBFC;}
  .field input:focus, .field select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .field input[readonly]{background:#F0EDE4;color:var(--accent-dark);font-weight:600;}
  .form-actions{display:flex;gap:10px;margin-top:18px;}
  .btn{padding:10px 18px;border-radius:var(--radius-sm);border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-ghost{background:none;border:1px solid var(--border);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--muted);}
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;padding:10px 12px;color:var(--muted);font-weight:600;font-size:12px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:11px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tbody tr:hover{background:#FAFBFC;}
  .row-actions{display:flex;gap:8px;}
  .icon-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;}
  .icon-btn svg{width:15px;height:15px;}
  .icon-btn.edit svg{color:var(--teal);}
  .icon-btn.delete svg{color:var(--danger);}
  .icon-btn:hover{border-color:var(--muted);}
  .empty-row td{text-align:center;color:var(--muted);padding:28px;}
  .amount{font-weight:600;color:var(--accent-dark);}
  @media(max-width:900px){.form-grid{grid-template-columns:repeat(2,1fr);} .card-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:720px){
    .sidebar{transform:translateX(-100%);} .sidebar.open{transform:translateX(0);}
    .main{margin-left:0;} .menu-btn{display:block;}
    .form-grid{grid-template-columns:1fr;} .card-grid{grid-template-columns:1fr;}
  }

</style>
</head>
<body>
